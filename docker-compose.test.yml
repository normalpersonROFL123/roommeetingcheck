services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner_test"]
      interval: 2s
      timeout: 2s
      retries: 15
  tests:
    build: .
    working_dir: /app
    environment:
      TEST_DATABASE_URL: postgresql://planner:planner@db-test:5432/planner_test
      PYTHONPATH: /app
    command: pytest -q
    depends_on:
      db-test:
        condition: service_healthy
